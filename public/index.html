<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Ops Command Center</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Property Ops Command Center</h1>
  </header>

  <main>
    <section id="login-section">
      <h2>Log in</h2>
      <form id="login-form">
        <!-- BUG (accessibility): inputs have no associated <label> -->
        <input type="email" id="login-email" placeholder="Email" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit">Log in</button>
      </form>
      <p id="login-status"></p>
      <p><small>Demo login: admin@calnan-mock.test / password123</small></p>
    </section>

    <section id="properties-section">
      <h2>Properties</h2>
      <label for="status-filter">Filter by status:</label>
      <select id="status-filter">
        <option value="">All</option>
        <option value="occupied">Occupied</option>
        <option value="vacant">Vacant</option>
      </select>
      <div id="properties-list"></div>
    </section>

    <section id="tenants-section">
      <h2>Tenants</h2>
      <table id="tenants-table">
        <thead>
          <tr><th>Name</th><th>Property</th><th data-sort="rent">Rent</th></tr>
        </thead>
        <tbody id="tenants-body"></tbody>
      </table>
    </section>

    <section id="maintenance-section">
      <h2>Maintenance Requests</h2>
      <div id="maintenance-status">Loading...</div>
      <!-- BUG: app.js looks for #maintenance-items, this element is
           #maintenance-list, so it never finds it and the spinner text
           above never gets replaced or cleared. -->
      <ul id="maintenance-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
